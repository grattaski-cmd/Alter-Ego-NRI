<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Черты — Справочник по Альтер-Эго</title>
    <meta name="description" content="Черты персонажей в мире Альтер-Эго: физические, ментальные, социальные, технические и гештальт-черты.">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили для страницы черт (добавляем прямо сюда, чтобы точно сработало) */
        .filter-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 1.4rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow);
            font-family: var(--font-body, 'Segoe UI', sans-serif);
            letter-spacing: 0.03em;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .trait-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-top: 1rem;
        }

        .trait-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.4rem 1.4rem 1.2rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            opacity: 0;
            transform: translateY(20px);
            display: flex;
            flex-direction: column;
            cursor: default;
        }
        .trait-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .trait-card:hover {
            transform: translateY(-4px) !important;
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(180, 138, 217, 0.15);
        }
        .trait-card .tag {
            display: inline-block;
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.1rem 0.8rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            align-self: flex-start;
        }
        .trait-card h3 {
            font-size: 1.15rem;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }
        .trait-card p {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin: 0;
            flex: 1;
        }
        .trait-card .trait-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.5;
            margin-top: 0.5rem;
            font-style: italic;
        }

        #no-results-traits {
            text-align: center;
            color: var(--text-muted);
            margin-top: 2rem;
        }

        @media (max-width: 700px) {
            .trait-grid { grid-template-columns: 1fr; }
            .filter-wrap { gap: 0.4rem; }
            .filter-btn { font-size: 0.75rem; padding: 0.3rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- ===== ЗАГРУЗОЧНЫЙ ЭКРАН ===== -->
    <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">АЛЬТЕР-ЭГО</div>
    </div>

    <!-- ===== ДИНАМИЧЕСКИЙ ГРАДИЕНТ ===== -->
    <div id="gradient-bg"></div>

    <!-- ===== ПРОГРЕСС-БАР ===== -->
    <div id="progressBar"></div>

    <!-- ===== КНОПКА НАВЕРХ ===== -->
    <button id="backToTop" aria-label="Наверх">↑</button>

    <!-- ===== ЧАСТИЦЫ ===== -->
    <canvas id="particlesCanvas"></canvas>

    <!-- ===== НАВИГАЦИЯ ===== -->
    <nav id="mainNav">
        <a href="index.html" class="nav-logo">АЛЬТЕР-ЭГО</a>
        <button class="nav-toggle" id="navToggle" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Главная</a>
            <a href="races.html">Расы</a>
            <a href="alt-gestalt.html">А. Гештальт</a>
            <a href="traits.html" class="active">Черты</a>
            <a href="Backstories.html">Предыстории</a>
            <a href="alternative.html">Отыгрыш</a>
            <a href="lore.html">Лор</a>
        </div>
    </nav>

    <!-- ===== КНОПКА ТЕМЫ ===== -->
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <!-- ===== ОСНОВНОЙ КОНТЕЙНЕР ===== -->
    <div class="content">

        <!-- ===== ХЛЕБНЫЕ КРОШКИ ===== -->
        <div class="breadcrumbs" id="breadcrumbs"></div>

        <!-- ===== ЗАГОЛОВОК ===== -->
        <h1 class="section-title">Черты</h1>
        <p class="section-desc">Особенности, которые определяют твоего персонажа. Каждая черта даёт уникальное преимущество.</p>

        <!-- ===== ПОИСК ===== -->
        <div class="search-wrap">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию или описанию...">
        </div>

        <!-- ===== ФИЛЬТРЫ ===== -->
        <div class="filter-wrap" id="filterButtons">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="physical">Физические</button>
            <button class="filter-btn" data-filter="mental">Ментальные</button>
            <button class="filter-btn" data-filter="social">Социальные</button>
            <button class="filter-btn" data-filter="technical">Технические</button>
            <button class="filter-btn" data-filter="geshtalt">Гештальт</button>
        </div>

        <!-- ===== СЕТКА ЧЕРТ ===== -->
        <div class="trait-grid" id="traitsGrid"></div>

        <!-- ===== ПОДВАЛ ===== -->
        <footer>
            <div class="footer-socials">
                <a href="https://t.me/yourchannel" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.13-.1-.18-.1-.05-.25-.03-.36-.02-.16.02-2.65 1.68-3.16 2.01-.4.27-.76.27-1.1.21-.49-.08-1.16-.28-1.77-.61-.75-.4-1.35-.61-1.3-1.29.03-.35.52-.71 1.44-1.08 3.05-1.33 5.1-2.2 6.13-2.62 2.92-1.16 3.53-1.36 3.92-1.36.09 0 .29.02.42.12.11.08.14.19.15.33.01.14-.03.29-.06.44z"/></svg>
                    Telegram
                </a>
                <a href="https://patreon.com/yourpage" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M14.82 2.41C13.21 2.14 11.56 2 10 2 5.5 2 2 5.5 2 10c0 4.5 3.5 8 8 8 1.56 0 3.21-.14 4.82-.41 2.12-.35 4.18-1.14 5.98-2.37C22.31 13.82 24 11.38 24 9c0-2.38-1.69-4.82-4.8-6.57-1.8-1.23-3.86-2.02-5.98-2.37z"/></svg>
                    Patreon
                </a>
                <a href="https://boosty.to/yourpage" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6h2V7zm0 8h-2v2h2v-2z"/></svg>
                    Boosty
                </a>
            </div>
            <div class="footer-copy">Справочник по Альтер-Эго • 2026</div>
        </footer>

    </div> <!-- .content -->

    <!-- ===== МОДАЛКА ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">&times;</button>
            <h3 id="modalTitle">Заголовок</h3>
            <p id="modalDesc">Описание</p>
            <span class="tag" id="modalTag">Тег</span>
        </div>
    </div>

    <!-- ===== ОБЩИЙ JS ===== -->
    <script src="main.js"></script>

    <!-- ===== СПЕЦИФИЧНЫЙ JS ДЛЯ ЧЕРТ ===== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // ДАННЫЕ ЧЕРТ
            // ============================================================
            const traitsData = [
                // Физические
                { category: 'physical', tag: 'Физическая', name: 'Крепкое тело', desc: 'Ваше тело закалено выживанием. +2 к выносливости и устойчивость к ядам.' },
                { category: 'physical', tag: 'Физическая', name: 'Быстрая реакция', desc: 'Вы молниеносно реагируете на угрозы. Преимущество при инициативе.' },
                { category: 'physical', tag: 'Физическая', name: 'Бегун пустошей', desc: 'Вы привыкли к долгим переходам. Ваша скорость на 10 футов выше, вы не устаёте на длинных дистанциях.' },
                { category: 'physical', tag: 'Физическая', name: 'Живучий', desc: 'Ваши раны заживают быстрее. При восстановлении хитов вы получаете +1 к каждому броску кости.' },
                { category: 'physical', tag: 'Физическая', name: 'Тяжеловес', desc: 'Вы можете нести больше снаряжения. +20% к грузоподъёмности.' },
                // Ментальные
                { category: 'mental', tag: 'Ментальная', name: 'Железная воля', desc: 'Ваш разум непоколебим. Сложно поддаться манипуляции или страху.' },
                { category: 'mental', tag: 'Ментальная', name: 'Аналитический ум', desc: 'Вы замечаете детали, которые другие упускают. Бонус к расследованию.' },
                { category: 'mental', tag: 'Ментальная', name: 'Хладнокровие', desc: 'В критической ситуации вы не теряете голову. Преимущество при спасбросках от страха.' },
                { category: 'mental', tag: 'Ментальная', name: 'Мастер планирования', desc: 'Вы всегда продумываете на 2 шага вперёд. Один раз в день вы можете изменить один бросок кубика.' },
                { category: 'mental', tag: 'Ментальная', name: 'Феноменальная память', desc: 'Вы никогда не забываете то, что видели или слышали. Бонус к проверкам на запоминание информации.' },
                // Социальные
                { category: 'social', tag: 'Социальная', name: 'Светское обаяние', desc: 'Вы легко находите общий язык с людьми. Бонус к дипломатии и убеждению.' },
                { category: 'social', tag: 'Социальная', name: 'Интуитивный психолог', desc: 'Вы читаете людей как открытую книгу. Бонус к определению лжи.' },
                { category: 'social', tag: 'Социальная', name: 'Пленительная речь', desc: 'Ваши слова завораживают. Вы можете пытаться убедить любого персонажа хотя бы на несколько минут.' },
                { category: 'social', tag: 'Социальная', name: 'Внушающий доверие', desc: 'Люди доверяют вам с первой встречи. +3 к социальным проверкам с незнакомцами.' },
                { category: 'social', tag: 'Социальная', name: 'Мастер переговоров', desc: 'Вы всегда выбиваете лучшие условия. Бонус к торгу и поиску компромиссов.' },
                // Технические
                { category: 'technical', tag: 'Техническая', name: 'Мастер-ремонтник', desc: 'Вы разбираетесь в механизмах и электронике. Чините и модифицируете снаряжение.' },
                { category: 'technical', tag: 'Техническая', name: 'Хакер', desc: 'Вы легко взламываете электронные системы и обходите защиту.' },
                { category: 'technical', tag: 'Техническая', name: 'Инженер-конструктор', desc: 'Вы можете создать импровизированное устройство из подручных материалов.' },
                { category: 'technical', tag: 'Техническая', name: 'Взрывотехник', desc: 'Вы знаете, как обращаться с взрывчаткой. Бонус к созданию и обезвреживанию взрывных устройств.' },
                { category: 'technical', tag: 'Техническая', name: 'Архивариус технологий', desc: 'Вы знаете историю и принципы работы любых устройств. Бонус к идентификации техники.' },
                // Гештальт
                { category: 'geshtalt', tag: 'Гештальт', name: 'Эхо памяти', desc: 'Ваш Гештальт сохранил отголоски прошлого. Иногда вы видите чужие воспоминания.' },
                { category: 'geshtalt', tag: 'Гештальт', name: 'Слияние с тенью', desc: 'Ваш Гештальт позволяет вам сливаться с тенями, становясь невидимым в темноте.' },
                { category: 'geshtalt', tag: 'Гештальт', name: 'Обострённое восприятие', desc: 'Ваш Гештальт обостряет чувства. Вы видите в темноте и слышите на большом расстоянии.' },
                { category: 'geshtalt', tag: 'Гештальт', name: 'Голос предков', desc: 'Ваш Гештальт говорит с вами во сне, давая подсказки и предупреждения.' },
                { category: 'geshtalt', tag: 'Гештальт', name: 'Рваная душа', desc: 'Ваша душа связана с Гештальтом так сильно, что вы можете чувствовать эмоции других существ.' }
            ];

            // ============================================================
            // РЕНДЕРИНГ КАРТОЧЕК
            // ============================================================
            const grid = document.getElementById('traitsGrid');
            let currentFilter = 'all';

            function renderTraits(data) {
                grid.innerHTML = '';
                data.forEach((trait, index) => {
                    const card = document.createElement('div');
                    card.className = 'trait-card';
                    card.dataset.category = trait.category;
                    card.dataset.index = index;
                    card.innerHTML = `
                        <span class="tag">${trait.tag}</span>
                        <h3>${trait.name}</h3>
                        <p>${trait.desc}</p>
                    `;
                    grid.appendChild(card);

                    // Анимация с задержкой
                    setTimeout(() => {
                        card.classList.add('visible');
                    }, 50 + index * 60);
                });
            }

            // Первичный рендер
            renderTraits(traitsData);

            // ============================================================
            // ФИЛЬТРЫ
            // ============================================================
            const filterButtons = document.querySelectorAll('.filter-btn');

            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    applyFilters();
                });
            });

            // ============================================================
            // ПОИСК + ФИЛЬТР (объединённая функция)
            // ============================================================
            const searchInput = document.getElementById('searchInput');

            function applyFilters() {
                const query = searchInput.value.toLowerCase().trim();
                const cards = grid.querySelectorAll('.trait-card');
                let hasVisible = false;

                cards.forEach((card, index) => {
                    const category = card.dataset.category;
                    const text = card.textContent.toLowerCase();
                    const matchFilter = currentFilter === 'all' || category === currentFilter;
                    const matchSearch = text.includes(query);
                    const isVisible = matchFilter && matchSearch;

                    if (isVisible) {
                        card.style.display = '';
                        hasVisible = true;
                        // Если карточка уже visible, не перезапускаем анимацию
                        if (!card.classList.contains('visible')) {
                            setTimeout(() => card.classList.add('visible'), 50 + index * 40);
                        }
                    } else {
                        card.style.display = 'none';
                        card.classList.remove('visible');
                    }
                });

                // Сообщение "ничего не найдено"
                let noResults = document.getElementById('no-results-traits');
                if (!noResults) {
                    noResults = document.createElement('p');
                    noResults.id = 'no-results-traits';
                    noResults.style.textAlign = 'center';
                    noResults.style.color = 'var(--text-muted)';
                    noResults.style.marginTop = '2rem';
                    grid.after(noResults);
                }

                if ((query !== '' || currentFilter !== 'all') && !hasVisible) {
                    noResults.textContent = 'Ничего не найдено. Попробуйте изменить запрос или фильтр.';
                    noResults.style.display = 'block';
                } else {
                    noResults.style.display = 'none';
                }
            }

            // Слушаем поиск
            searchInput.addEventListener('input', applyFilters);

            // ============================================================
            // КЛИК ПО КАРТОЧКЕ → МОДАЛКА
            // ============================================================
            const modal = document.getElementById('modal');
            if (modal) {
                const modalClose = document.getElementById('modalClose');
                const modalTitle = document.getElementById('modalTitle');
                const modalDesc = document.getElementById('modalDesc');
                const modalTag = document.getElementById('modalTag');

                grid.addEventListener('click', function(e) {
                    const card = e.target.closest('.trait-card');
                    if (!card) return;
                    const title = card.querySelector('h3')?.textContent || 'Без названия';
                    const desc = card.querySelector('p')?.textContent || 'Нет описания';
                    const tag = card.querySelector('.tag')?.textContent || '';
                    if (modalTitle) modalTitle.textContent = title;
                    if (modalDesc) modalDesc.textContent = desc;
                    if (modalTag) modalTag.textContent = tag;
                    modal.classList.add('active');
                });

                if (modalClose) {
                    modalClose.addEventListener('click', () => modal.classList.remove('active'));
                }
                modal.addEventListener('click', function(e) {
                    if (e.target === this) modal.classList.remove('active');
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') modal.classList.remove('active');
                });
            }

            // ============================================================
            // ИНИЦИАЛИЗАЦИЯ: применяем фильтры после рендера
            // ============================================================
            // Небольшая задержка, чтобы карточки успели отрендериться
            setTimeout(applyFilters, 300);

        })();
    </script>
</body>
</html>
