<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предыстории — Справочник по Альтер-Эго</title>
    <meta name="description" content="Предыстории персонажей в мире Альтер-Эго: от выживших до учёных и преступников.">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ ПРЕДЫСТОРИЙ ===== */
        .filter-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 1.4rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow);
            font-family: var(--font-body, 'Segoe UI', sans-serif);
            letter-spacing: 0.03em;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .backstory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-top: 1rem;
        }

        .backstory-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.4rem 1.4rem 1.2rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s, opacity 0.4s ease;
            opacity: 0;
            transform: translateY(20px);
            display: flex;
            flex-direction: column;
            cursor: default;
        }
        .backstory-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .backstory-card:hover {
            transform: translateY(-4px) !important;
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(180, 138, 217, 0.15);
        }
        .backstory-card .tag {
            display: inline-block;
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.1rem 0.8rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            align-self: flex-start;
        }
        .backstory-card h3 {
            font-size: 1.15rem;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }
        .backstory-card p {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin: 0 0 0.8rem;
            flex: 1;
        }
        .backstory-card a {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            transition: gap 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: auto;
            text-decoration: none;
        }
        .backstory-card a:hover { gap: 8px; text-decoration: underline; }

        #no-results-backstories {
            text-align: center;
            color: var(--text-muted);
            margin-top: 2rem;
        }

        @media (max-width: 700px) {
            .backstory-grid { grid-template-columns: 1fr; }
            .filter-wrap { gap: 0.4rem; }
            .filter-btn { font-size: 0.75rem; padding: 0.3rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- ===== КНОПКА ТЕМЫ ===== -->
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <!-- ===== ОСНОВНОЙ КОНТЕЙНЕР ===== -->
    <div class="content">

        <!-- ===== ХЛЕБНЫЕ КРОШКИ ===== -->
        <div class="breadcrumbs" id="breadcrumbs"></div>

        <!-- ===== ПОИСК ===== -->
        <div class="search-wrap">

        <!-- ===== ЗАГОЛОВОК ===== -->
        <h1 class="section-title">Предыстории</h1>

            <button class="filter-btn" data-filter="выживание">Выживание</button>

    <!-- ===== ОБЩИЙ JS ===== -->
    <script src="main.js"></script>

    <!-- ===== ИСПРАВЛЕННЫЙ СПЕЦИФИЧНЫЙ JS ДЛЯ ПРЕДЫСТОРИЙ ===== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // ДАННЫЕ ПРЕДЫСТОРИЙ С ПОЛНЫМИ НАЗВАНИЯМИ
            // ============================================================
            const backstoriesData = [
                // Выживание
                { category: 'выживание', tag: 'Выживание', name: 'Беженец из мира маны', desc: 'Вы бежали от чумы и научились выживать в пустошах. Вы знаете, где найти воду и укрытие.', link: 'bezhenets-many.html' },
                { category: 'выживание', tag: 'Выживание', name: 'Охотник за компонентами', desc: 'Вы добывали пищу для своей общины. Отличное владение луком и знание повадок животных.', link: 'ohotnik-za-komponentami.html' },
                { category: 'выживание', tag: 'Выживание', name: 'Странник пустошей', desc: 'Вы провели годы в пустошах, изучая местность. Вы никогда не теряетесь и всегда находите путь.', link: 'strannik-pustroshey.html' },
                { category: 'выживание', tag: 'Выживание', name: 'Дети руин', desc: 'Вы выросли в руинах старого мира. Вы знаете каждую трещину и можете найти путь в любых развалинах.', link: 'deti-ruin.html' },
                { category: 'выживание', tag: 'Выживание', name: 'Охотник на мутантов', desc: 'Вы профессионально выслеживаете и уничтожаете заражённых. Грязная работа, которую кто-то должен делать.', link: 'ohotnik-na-mutantov.html' },
                // Силовые
                { category: 'силовые', tag: 'Силовые', name: 'Солдат старого мира', desc: 'Вы служили в армии до катастрофы. Дисциплина, владение оружием и тактическое мышление.', link: 'soldat-starogo-mira.html' },
                { category: 'силовые', tag: 'Силовые', name: 'Ополченец поселения', desc: 'Вы сражались на арене за выживание. Вы умеете читать противника и наносить смертельные удары.', link: 'opolchenets.html' },
                { category: 'силовые', tag: 'Силовые', name: 'Страж периметра', desc: 'Вы защищали важных людей. Вы всегда начеку и готовы принять удар на себя.', link: 'strazh-perimetra.html' },
                { category: 'силовые', tag: 'Силовые', name: 'Бывший подопытный', desc: 'Вы пережили эксперименты с чумой и Мэйки. Ваше тело — результат жестоких опытов.', link: 'byvshiy-podopytnyy.html' },
                // Гештальт
                { category: 'гештальт', tag: 'Гештальт', name: 'Последователь Гештальта', desc: 'Ваш Гештальт проснулся первым. Вы чувствуете его присутствие и можете черпать силу из него.', link: 'posledovatel-geshtalta.html' },
                { category: 'гештальт', tag: 'Гештальт', name: 'Исследователь чумы', desc: 'Вы изучали природу Гештальтов. Вы знаете их слабые места и можете предсказывать их поведение.', link: 'issledovatel-chumy.html' },
                { category: 'гештальт', tag: 'Гештальт', name: 'Изгнанный', desc: 'Ваш Гештальт пугает людей. Вы привыкли к одиночеству и научились скрывать свою сущность.', link: 'izgnannyy.html' },
                { category: 'гештальт', tag: 'Гештальт', name: 'Избежавший поглощения', desc: 'Вы чудом избежали полного поглощения Гештальтом. Теперь вы носите в себе страх и мудрость тех, кто не выжил.', link: 'izbezhavshiy-pogloshcheniya.html' },
                { category: 'гештальт', tag: 'Гештальт', name: 'Свидетель поглощения', desc: 'Вы видели, как Гештальт поглощает другого. Этот ужас навсегда изменил вас, но дал вам неожиданную силу.', link: 'svidetel-pogloshcheniya.html' },
                // Мана
                { category: 'мана', tag: 'Мана', name: 'Манолог', desc: 'Вы изучаете ману и её проявления. Ваше тело — лаборатория для магических экспериментов.', link: 'manolog.html' },
                { category: 'мана', tag: 'Мана', name: 'Авангард маны', desc: 'Вы пришли из мира маны как захватчик или разведчик. Выжили любой ценой и теперь здесь.', link: 'avangard-many.html' },
                // Техника
                { category: 'техника', tag: 'Техника', name: 'Системный техник', desc: 'Вы строите и чините механизмы. Вы можете создавать устройства из подручных материалов.', link: 'sistemnyy-tekhnik.html' },
                { category: 'техника', tag: 'Техника', name: 'Саботажник протоколов', desc: 'Вы умеете обходить системы безопасности и ломать протоколы. Ваша цель — свобода от контроля.', link: 'sabotazhnik-protokolov.html' },
                { category: 'техника', tag: 'Техника', name: 'Перепрошивальщик', desc: 'Вы перепрограммируете андроидов и другие системы. Вы даёте свободу искусственному разуму.', link: 'pereproshivalshchik.html' },
                // Общество
                { category: 'общество', tag: 'Общество', name: 'Посредник', desc: 'Вы улаживаете конфликты между фракциями. Вы знаете, кто кому должен, и как на этом заработать.', link: 'posrednik.html' },
                { category: 'общество', tag: 'Общество', name: 'Информатор', desc: 'Вы собираете и продаёте информацию. Ваши знания — ваша валюта.', link: 'informator.html' },
                { category: 'общество', tag: 'Общество', name: 'Проводник', desc: 'Вы путешествовали с караванами. Вы знаете цену вещам и умеете торговаться.', link: 'provodnik.html' },
                // Религия
                { category: 'религия', tag: 'Религия', name: 'Хранитель старой веры', desc: 'Вы служили в храме. Вы знаете древние обряды и можете изгонять тёмные силы.', link: 'hranitel-staroy-very.html' },
                { category: 'религия', tag: 'Религия', name: 'Хранитель убежища', desc: 'Вы жили в уединении, молясь и медитируя. Ваша вера даёт вам силу в трудные моменты.', link: 'hranitel-ubezhishcha.html' },
                { category: 'религия', tag: 'Религия', name: 'Падальщик памяти', desc: 'Вы собираете и сохраняете воспоминания о погибшем мире. Ваша коллекция — ключ к прошлому.', link: 'padalshchik-pamyati.html' },
                // Преступность
                { category: 'преступность', tag: 'Преступность', name: 'Контрабандист', desc: 'Вы перевозили запрещённые товары. Вы знаете обходные пути и имеете связи на чёрном рынке.', link: 'kontrabandist.html' },
                { category: 'преступность', tag: 'Преступность', name: 'Рейдер', desc: 'Вы грабили караваны и нападали на поселения. Ваша жизнь — постоянный риск и добыча.', link: 'reyder.html' },
                { category: 'преступность', tag: 'Преступность', name: 'Чистильщик', desc: 'Вы уничтожаете заражённые зоны и мутантов. Ваша работа — грязная и опасная, но необходимая.', link: 'chistilshchik.html' },
                // Героизм
                { category: 'героизм', tag: 'Героизм', name: 'Защитник слабых', desc: 'Вы всегда на стороне тех, кто не может защитить себя. Ваш путь — справедливость.', link: 'zashchitnik-slabykh.html' },
                // Наука
                { category: 'наука', tag: 'Наука', name: 'Искатель утраченного', desc: 'Вы ищете артефакты и технологии старого мира. Ваша страсть — находить то, что другие считают потерянным.', link: 'iskatel-utrachennogo.html' },
                { category: 'наука', tag: 'Наука', name: 'Целитель чумы', desc: 'Вы лечите тех, кто пострадал от чумы. Ваши знания и инструменты — последняя надежда для многих.', link: 'tselitel-chumy.html' },
                { category: 'наука', tag: 'Наука', name: 'Архивариус', desc: 'Вы храните знания старого мира. Архивы, записи и память — ваше оружие против забвения.', link: 'arkhivarius.html' },
                // Рабство
                { category: 'рабство', tag: 'Рабство', name: 'Долговой раб', desc: 'Вы отрабатываете долг, который не вы выбрали. Ваша цель — свобода, даже если для этого придётся сбежать.', link: 'dolgovoy-rab.html' },
                { category: 'рабство', tag: 'Рабство', name: 'Отрицатель', desc: 'Вы отказываетесь принимать реальность. Вы живёте в собственном мире, где чума — всего лишь иллюзия.', link: 'otritsatel.html' },
                { category: 'рабство', tag: 'Рабство', name: 'Беглый раб', desc: 'Вы сбежали из неволи. Теперь вы всегда готовы бежать дальше и никому не доверяете.', link: 'beglyy-rab.html' }
            ];

            // ============================================================
            // РЕНДЕРИНГ КАРТОЧЕК
            // ============================================================
            const grid = document.getElementById('backstoriesGrid');
            let currentFilter = 'all';

            function renderBackstories(data) {
                grid.innerHTML = '';
                data.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'backstory-card visible';
                    card.dataset.category = item.category;
                    card.innerHTML = `
                        <span class="tag">${item.tag}</span>
                        <h3>${item.name}</h3>
                        <p>${item.desc}</p>
                        <a href="${item.link}">Подробнее →</a>
                    `;
                    grid.appendChild(card);
                });
            }

            renderBackstories(backstoriesData);

            // ============================================================
            // ФИЛЬТРЫ
            // ============================================================
            const filterButtons = document.querySelectorAll('.filter-btn');

            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    applyFilters();
                });
            });

            // ============================================================
            // ПОИСК + ФИЛЬТР
            // ============================================================
            const searchInput = document.getElementById('searchInput');

            function applyFilters() {
                const query = searchInput.value.toLowerCase().trim();
                const cards = grid.querySelectorAll('.backstory-card');
                let hasVisible = false;

                cards.forEach((card) => {
                    const category = card.dataset.category;
                    const text = card.textContent.toLowerCase();
                    const matchFilter = currentFilter === 'all' || category === currentFilter;
                    const matchSearch = text.includes(query);
                    const isVisible = matchFilter && matchSearch;

                    if (isVisible) {
                        card.style.display = '';
                        card.classList.add('visible');
                        hasVisible = true;
                    } else {
                        card.style.display = 'none';
                        card.classList.remove('visible');
                    }
                });

                let noResults = document.getElementById('no-results-backstories');
                if (!noResults) {
                    noResults = document.createElement('p');
                    noResults.id = 'no-results-backstories';
                    noResults.style.textAlign = 'center';
                    noResults.style.color = 'var(--text-muted)';
                    noResults.style.marginTop = '2rem';
                    grid.after(noResults);
                }

                if ((query !== '' || currentFilter !== 'all') && !hasVisible) {
                    noResults.textContent = 'Ничего не найдено. Попробуйте изменить запрос или фильтр.';
                    noResults.style.display = 'block';
                } else {
                    noResults.style.display = 'none';
                }
            }

            searchInput.addEventListener('input', applyFilters);
            applyFilters();

        })();
    </script>

    <!-- ===== АВАРИЙНОЕ СКРЫТИЕ ЗАГРУЗОЧНОГО ЭКРАНА ===== -->
    <script>
        (function() {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('hidden');
            }
        })();
    </script>

</body>
