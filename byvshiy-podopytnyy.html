<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бывший подопытный — Предыстория — Справочник по Альтер-Эго</title>
    <meta name="description" content="Предыстория Бывший подопытный в мире Альтер-Эго: выживший после жестоких экспериментов.">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== СПЕЦИФИЧЕСКИЕ СТИЛИ ===== */
        .backstory-title {
            position: relative;
            display: inline-block;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow), 0 0 30px rgba(180, 138, 217, 0.2);
        }
        .backstory-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .backstory-block {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(4px);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .backstory-block:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(180, 138, 217, 0.15);
        }

        .section-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.8rem;
            height: 1.8rem;
            flex-shrink: 0;
            color: var(--accent);
        }
        .section-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.6rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
            margin-bottom: 0.8rem;
            font-family: 'Cinzel', serif;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }
        .feature-item {
            background: var(--bg-nav);
            padding: 0.8rem 1.2rem;
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .feature-item strong {
            color: var(--accent);
            display: block;
            margin-bottom: 0.2rem;
        }
        .feature-item .value {
            color: var(--text);
            font-size: 0.93rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        .feature-item ul {
            margin: 0.3rem 0 0 1.2rem;
            padding: 0;
            color: var(--text);
        }

        .ideal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .ideal-card {
            background: var(--bg-nav);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.8rem 1rem;
            transition: border-color 0.3s;
        }
        .ideal-card:hover {
            border-color: var(--accent);
        }
        .ideal-card strong {
            color: var(--accent);
            display: block;
            font-size: 0.9rem;
        }
        .ideal-card p {
            margin: 0.2rem 0 0;
            font-size: 0.85rem;
            color: var(--text);
        }

        .rp-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0;
        }
        .rp-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: baseline;
        }
        .rp-list li:last-child {
            border-bottom: none;
        }
        .rp-icon {
            width: 1.4rem;
            height: 1.4rem;
            flex-shrink: 0;
            color: var(--accent);
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }

        .muted {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .tag {
            display: inline-block;
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.1rem 0.6rem;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 1.5rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: gap var(--transition);
        }
        .back-link:hover {
            gap: 12px;
            text-decoration: underline;
        }

        #no-results-subject {
            text-align: center;
            color: var(--text-muted);
            margin-top: 2rem;
        }

        @media (max-width: 700px) {
            .backstory-title { font-size: 2rem !important; }
            .backstory-title svg { width: 1.8rem !important; height: 1.8rem !important; }
            .backstory-block { padding: 1.2rem; }
            .section-icon { width: 1.4rem; height: 1.4rem; }
            .ideal-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .backstory-title { font-size: 1.6rem !important; }
            .backstory-title svg { width: 1.4rem !important; height: 1.4rem !important; }
        }
    </style>

</head>
<body>
